[package]
name = "rune"
version = "0.1.0"
description = "Encrypted, offline, zero-knowledge desktop notepad."
authors = ["Rune Contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
ring = "0.17"
argon2 = "0.5"
rand = "0.8"
base64 = { version = "0.22", features = ["std"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
parking_lot = "0.12"
docx-rs = "0.4.22"
# Indeks wyszukiwania FTS5 trzymany w pamięci (`:memory:`). `bundled` kompiluje
# SQLite z włączonym FTS5 — żaden plaintext nie trafia na dysk jako plik SQLite.
rusqlite = { version = "0.31", features = ["bundled"] }

# Anti-screenshot: SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE). Wersja
# dopasowana do tej, którą ciągnie Tauri (window.hwnd() zwraca ten sam HWND).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
